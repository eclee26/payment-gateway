x-laravel-env: &laravel-env
  APP_URL: http://localhost:${APP_PORT:-8000}
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-payment_gateway}
  DB_USERNAME: ${DB_USERNAME:-laravel}
  DB_PASSWORD: ${DB_PASSWORD:-secret}
  COMPOSER_HOME: /tmp/composer

# PHP-FPM, artisan, queue and scheduler all run as www-data so files they
# create in storage/ (logs, compiled views, cache) stay writable by each other.
services:
  app:
    build:
      context: .
      target: dev
    image: payment-gateway-app:dev
    user: www-data
    volumes:
      - .:/var/www/html
    environment: *laravel-env
    depends_on:
      mysql:
        condition: service_healthy

  web:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    image: payment-gateway-app:dev
    user: www-data
    command: php artisan queue:listen --tries=1 --timeout=0
    volumes:
      - .:/var/www/html
    environment: *laravel-env
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  # Runs scheduled tasks, e.g. pruning expired idempotency keys.
  scheduler:
    image: payment-gateway-app:dev
    user: www-data
    command: php artisan schedule:work
    volumes:
      - .:/var/www/html
    environment: *laravel-env
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-payment_gateway}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-secret}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional Vite dev server with HMR: docker compose --profile vite up -d
  vite:
    image: node:22-alpine
    profiles: ["vite"]
    working_dir: /var/www/html
    command: sh -c "npm install && npx vite --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/var/www/html
      - node-modules:/var/www/html/node_modules

volumes:
  mysql-data:
  node-modules:
